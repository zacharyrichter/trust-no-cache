# /etc/sysctl.d/99-hardening.conf
# Kernel and network hardening for the VPS (managed by hand).
# Restored Nov 2026 after this file was found holding only the forwarding lines.
#
# rp_filter is deliberately NOT set here. The kernel uses the higher of
# conf.all and conf.<iface>, so all=2 would loosen eth0. eth0 is strict (1)
# in 99-rpfilter.conf; other interfaces keep the distro default of 2.

# ICMP redirects and source routing
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.all.accept_source_route = 0

# SYN flood protection
net.ipv4.tcp_syncookies = 1

# Ignore broadcast pings and bogus ICMP error responses
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Log martian packets
net.ipv4.conf.all.log_martians = 1

# Magic SysRq off (the provider console can reset the VPS without it)
kernel.sysrq = 0

# Hide kernel pointers, restrict dmesg to root
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1

# Full ASLR
kernel.randomize_va_space = 2

# Symlink and hardlink protections
fs.protected_symlinks = 1
fs.protected_hardlinks = 1

# Forwarding for WireGuard and Docker
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
