services:
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    user: "1000:1000"
    command: serve
    environment:
      - TZ=UTC
    volumes:
      - ./data:/var/lib/ntfy
      - ./server.yml:/etc/ntfy/server.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      warpconduit:
        ipv4_address: 172.18.0.7
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    memswap_limit: 192m
    stop_grace_period: 10s

networks:
  warpconduit:
    external: true
