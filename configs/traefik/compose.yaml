services:
  traefik:
    container_name: traefik
    image: traefik:latest
    ports:
      - 443:443
    volumes:
      - ./config:/etc/traefik/
    networks:
      warpconduit:
        ipv4_address: 172.18.0.2
    env_file:
      - path: ./.env
        required: true
    restart: always
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    memswap_limit: 320m
    stop_grace_period: 30s
networks:
  warpconduit:
    external: true
